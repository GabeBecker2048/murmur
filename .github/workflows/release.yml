# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes that version:
# the container image to ghcr.io as X.Y.Z and latest, and a GitHub release
# carrying that version's CHANGELOG entry. Murmur is never published to PyPI.
#
# The server pulls :latest every morning (docker-autopatch), so a release is
# what deploys. Merges to main only build and smoke-test (image.yml).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Everything that can say "no" happens here, before anything is published.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: The tag matches pyproject.toml, and CHANGELOG.md has an entry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^version = \"${version}\"$" pyproject.toml \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md || { echo "::error::no '## [${version}]' section in CHANGELOG.md"; exit 1; }
          echo "Release notes:"; cat notes.md

      - run: uv sync --locked --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build, smoke-test, push
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: murmur:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm murmur:release murmur --version | grep -q "${GITHUB_REF_NAME#v}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" \
            --title "Murmur ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
