# Builds and smoke-tests the image on every pull request and push to main.
# Publishing to ghcr.io happens only on a release (release.yml).
name: Image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: murmur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm murmur:ci murmur --version
          docker run --rm murmur:ci python -c "import murmur.cli, murmur.scheduler; print('imports ok')"
          docker run --rm murmur:ci sh -c 'murmur health; test $? -eq 1'   # no heartbeat yet -> 1
