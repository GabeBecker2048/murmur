[project]
name = "murmur"
version = "0.8.2"
description = "Daily news-sentiment vs stock-return pipeline for the largest US companies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# PyPI rejects any distribution carrying a "Private ::" classifier. This
# project is never published to PyPI.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "yfinance>=1.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.10",
    "torch>=2.4",
    "transformers>=4.45",
    "matplotlib>=3.8",
    "exchange-calendars>=4.5",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tomli-w>=1.0",
    "boto3>=1.35",
]

[project.scripts]
murmur = "murmur.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmur"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts calls in defaults on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # exchange_calendars on pandas 3: not ours to fix
    "ignore:Series.values returning an ndarray:DeprecationWarning",
]
