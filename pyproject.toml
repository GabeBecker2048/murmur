[project]
name = "murmur"
version = "0.1.0"
description = "Daily news-sentiment vs stock-return pipeline for the largest US companies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# PyPI rejects any distribution carrying a "Private ::" classifier. This
# project is never published to PyPI.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "yfinance>=1.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.10",
    "torch>=2.4",
    "transformers>=4.45",
    "matplotlib>=3.8",
]

[project.scripts]
murmur = "murmur.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmur"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
