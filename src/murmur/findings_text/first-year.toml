title = "The first year"

headline = "News moves with stock prices on the same day and trails them a little, but it does not predict the next day."

summary = [
  "Over one full year of Finnhub headlines (11 November 2025 to 10 November 2026: 251 trading sessions, 122 companies, about 252,000 scored headlines), the tone of a company's headlines on a trading day correlates with its stock's return that same day at r = 0.16.",
  "That link is about the company, not the market's mood. Subtracting the whole index's move each day leaves r = 0.15. Taken one day at a time, the correlation across companies averages 0.15 and is positive on 89 % of sessions. Shuffling headlines between companies within each day drops it to 0.02.",
  "News also trails prices: a company's headlines still lean toward the previous session's move (r = 0.09). It does not lead them: today's headlines against the next session's return give r = −0.008, a 95 % interval that includes zero, and a day-by-day average indistinguishable from zero (t = −1.3).",
  "The 50 largest companies show a somewhat stronger same-day link (0.18) than ranks 51 to 100 (0.15).",
]

caveats = [
