title = "The first year"

headline = "News moves with stock prices on the same day and trails them a little, but it does not predict the next day."

summary = [
  "Over the first year of data (3 November 2025 to 30 October 2026: 244 trading sessions, 121 companies, about 242,000 scored headlines), the tone of a company's headlines on a trading day correlates with its stock's return that same day at r = 0.16.",
  "That link is about the company, not the market's mood. Subtracting the whole index's move each day leaves r = 0.15. Taken one day at a time, the correlation across companies averages 0.15 and is positive on 90 % of sessions. Shuffling headlines between companies within each day drops it to 0.02.",
  "News also trails prices: a company's headlines still lean toward the previous session's move (r = 0.09). It does not lead them: the next session's return is unrelated to today's headlines (r = -0.004, inside the range shuffled headlines produce).",
  "The 50 largest companies show a somewhat stronger same-day link (0.19) than ranks 51 to 100 (0.15).",
]

caveats = [
  "Correlation is not causation. A same-day link fits news reporting moves that happen during the day, prices reacting to news, or both; daily data cannot tell them apart.",
  "r = 0.16 is a real but small effect: headline sentiment accounts for about 2.5 % of the variation in daily returns.",
  "The year is almost entirely Finnhub headlines; Yahoo headlines are collected only from 5 November 2026 on, so the live figures mix two sources.",
  "Index months before October 2026 were reconstructed from today's list of large US companies, so a company that shrank or was delisted during the year is missing (survivorship bias).",
