# Packaged defaults. A user file (./murmur.toml, MURMUR_CONFIG, or --config)
# is merged over these, so it only needs the keys it changes.

data_dir = "data"               # store at <data_dir>/murmur.sqlite, exports at <data_dir>/published/
timezone = "America/New_York"   # the calendar that defines a "day"

[news]
max_articles = 20               # per ticker per fetch (Yahoo)
# Which news sources the daily run queries. "yahoo" needs nothing. "finnhub"
# needs an API key and supports date ranges (used by `murmur news --from`).
# "gdelt" needs no key, supports ranges, but is limited to one request every
# 5 seconds, so a 100-ticker run takes ~9 minutes.
sources = ["yahoo"]

[prices]
# "yfinance" (no key; today's bar after the close) or "polygon" (free plan refuses
# today's bar until the day is over: backfills, or a morning schedule.analysis_time).
source = "yfinance"
# Split ratios so returns across a split day are right with unadjusted sources:
# "auto" = polygon when its key is set, else none; "polygon"; "none".
splits = "auto"

[finnhub]
api_key = ""                    # or MURMUR_FINNHUB_API_KEY

[polygon]
api_key = ""                    # or MURMUR_POLYGON_API_KEY

[sentiment]
model = "ProsusAI/finbert"
batch_size = 32
device = "cpu"                  # "cpu", "cuda" or "auto" (cuda if available)

[analysis]
# Per-company rolling results are large (100 companies x 4 horizons x 9 pairs x 3 lags x
# 2 methods x sources, per session). Keep them for the latest N sessions plus each
# month's last session; pooled results are kept forever and published daily.
keep_ticker_rolling_sessions = 30

[sec]
# The SEC's fair-access policy requires a contact email in the User-Agent of
# every request. Used once a month to fetch the public ticker/CIK list.
contact = "gabebecker2048@gmail.com"

[index]
# The cap-weighted list of the `size` largest US-domiciled companies on
# NYSE/Nasdaq (SEC ticker list + Yahoo screener), rebalanced on the first
# trading day of each month and published as a dataset under `name`
# ("m100" -> Murmur 100). weight = market cap / the month's total.
name = "m100"
size = 100

[universe]
# "marketcap": the top `size` of the index get news and sentiment (coverage;
# at most index.size). "static": the fixed list below. Membership is recorded
# in the store per day either way, so analysis never reads this file directly.
source = "marketcap"
size = 100
min_market_cap = 10_000_000_000  # screener floor; keep well below the last company's cap

[schedule]
time = "18:00"                  # local time in `timezone`, every day incl. weekends
# A second slot splits the day: at `time` only news is collected (and scored), and at
# `analysis_time` prices, analysis and export run for the previous session. Needed
# when the price source's bar for a day is final only after the evening run.
analysis_time = ""              # e.g. "06:30"; empty = one full run at `time`
paused = false                  # true: the scheduler queues nothing (manual jobs still run)
retries = 3                     # extra attempts when a stage fails
retry_delay_minutes = 20

[ui]
title = "Murmur"
tagline = "Does news predict prices, follow them, or move with them?"
default_months = 3              # rolling horizon the dashboard opens with: 1, 3, 6 or 12
default_method = "pearson"      # or "spearman"
theme = "auto"                  # "auto", "light" or "dark"; visitors can switch

[datasets]
# Datasets served from /data only with the API token (still in the manifest,
# flagged public = false). Empty = everything public. The prices table is
# published under a "source terms apply" notice, not CC BY (see publish.py).
private = []
# Contact printed in every license notice, for takedown requests; default sec.contact.
contact = ""

[api]
host = "0.0.0.0"
port = 8100
# The bearer token for POST/PUT/DELETE comes from MURMUR_API_TOKEN (never a file).
# MURMUR_CORS_ORIGINS (comma-separated) enables CORS for a UI served elsewhere.

