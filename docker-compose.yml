# Murmur on gabe-server. Lives at /home/gabe/murmur/ with:
#   ./data/            the store, exports, settings.toml (edited via the API), heartbeats,
#                      job backups and the Hugging Face cache (bind mount)
#   ./config/murmur.toml   ops overrides over the packaged defaults (may be empty; read-only)
#   ./data/offsite/    the backup service's status, heartbeat and staging (create it
#                      before the first `up`: mkdir -p data/offsite)
#   ./s3.env           MURMUR_S3_BUCKET, MURMUR_S3_REGION, AWS_ACCESS_KEY_ID,
#                      AWS_SECRET_ACCESS_KEY: read by murmur-backup ONLY (optional; without
#                      it the backup service idles and the health report says so)
# One image, four services (0.8.0): the API + UI, the scheduler (queues the daily run
# and the 04:30 snapshot on its own clock, so a long job never delays it), the worker
# (the only process that runs jobs and FinBERT) and the backup service (copies each new
# snapshot to S3). Exactly one worker per store: SQLite is single-writer.
# The image is pulled from ghcr.io (built by .github/workflows/release.yml), so
# docker-autopatch keeps it updated; `docker compose build` works too.
name: murmur

x-murmur: &murmur
  image: ghcr.io/gabebecker2048/murmur:latest
  build: .
  restart: unless-stopped
  user: "1000:1000"
  # Secrets live in ./.env, never committed (the collect script strips it to .env.example):
  #   MURMUR_API_TOKEN          bearer token for POST/PUT/DELETE; writes are refused without it
  #   MURMUR_FINNHUB_API_KEY, MURMUR_POLYGON_API_KEY   optional sources
  env_file:
    - path: .env
      required: false
  environment:
    # The schedule fires at config `timezone` (America/New_York) regardless of
    # TZ; TZ only affects log timestamps.
    TZ: America/New_York
    MURMUR_DATA_DIR: /data
    MURMUR_CONFIG: /config/murmur.toml
    HF_HOME: /data/hf-cache
  volumes:
    - type: bind
      source: ./data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ./config
      target: /config
      read_only: true
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  murmur:
    <<: *murmur
    container_name: murmur
    command: ["murmur", "serve", "--no-worker"]
    # The API (and /docs) on the LAN; murmur.gabe.beer routes here through Caddy.
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "murmur", "health"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 512m
    cpus: 1.0

  murmur-scheduler:
    <<: *murmur
    container_name: murmur-scheduler
    command: ["murmur", "scheduler"]
    depends_on:
      murmur:
        condition: service_healthy   # the API creates and migrates the store first
    healthcheck:
      test: ["CMD", "murmur", "health", "--role", "scheduler"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  murmur-worker:
    <<: *murmur
    container_name: murmur-worker
    command: ["murmur", "worker"]
    depends_on:
      murmur:
        condition: service_healthy
    # A job in flight (FinBERT on a chunk of headlines) needs a moment to stop cleanly.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "murmur", "health", "--role", "worker"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    # Measured on the 2026-11-05 run with 100 tickers (see README "Deploy"):
    # FinBERT on CPU peaks around 1.0 GB RSS (994 MB). 6 shared cores on the server.
    mem_limit: 2g
    cpus: 3.0

  murmur-backup:
    <<: *murmur
    container_name: murmur-backup
    command: ["murmur", "offsite"]
    # The only service with the S3 credentials, and not the API token or source keys.
    env_file:
      - path: s3.env
        required: false
    # It never opens the store: the data volume is read-only except its own directory.
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/offsite
        target: /data/offsite
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      murmur:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "murmur", "health", "--role", "backup"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    # gzip of a ~1 GB snapshot streams through 1 MB chunks; boto3 multipart buffers ~80 MB.
    mem_limit: 256m
    cpus: 0.5
