# Copy to ./murmur.toml (gitignored), or point MURMUR_CONFIG / --config at it.
# Only the keys you set are overridden; see src/murmur/default_config.toml
# for everything available. An empty file is valid and means "all defaults".

data_dir = "data"

[news]
max_articles = 20

[sentiment]
device = "cpu"              # "cuda" or "auto" on a machine with a GPU build of torch

[universe]
source = "marketcap"        # or "static" to use [universe.static] from the defaults
size = 100

[schedule]
time = "18:00"              # America/New_York, every day
retries = 3
retry_delay_minutes = 20
